# API Keys 配置（必填）
apis:
  serpapi:
    key: "YOUR_SERPAPI_KEY_HERE"
    enabled: true
  
  seedream:
    key: "YOUR_SEEDREAM_KEY_HERE"
    enabled: true

# 默认参数
defaults:
  pages:
    target: 50
    min: 30
    max: 80
  
  papers:
    target: 100
    min: 50
    max: 150
  
  quality:
    target_score: 95
    min_acceptable: 85
    max_iterations: 3
    auto_iterate: true

# 模块开关
modules:
  survey_writer: true
  survey_expander: true
  survey_evolution: true
  latex_typesetting: true
  diagram_generation: true
  seedream_poster: true
  serpapi_search: true
